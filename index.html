<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=3840, initial-scale=1" />
    <title>Concentric Panel</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="clock">
      <div class="dial">
        <div class="rings"></div>
        <div class="hour"></div>
      </div>

      <aside class="panel">
        <div class="weekday"></div>
        <div class="full-date"></div>

        <section class="calendar">
          <div class="calendar-title"></div>
          <div class="calendar-grid"></div>
        </section>

        <section class="progress">
          <div class="progress-row">
            <span>DAY</span>
            <div class="bar"><div class="bar-fill" data-progress="day"></div></div>
            <span data-label="day"></span>
          </div>
          <div class="progress-row">
            <span>YEAR</span>
            <div class="bar"><div class="bar-fill" data-progress="year"></div></div>
            <span data-label="year"></span>
          </div>
        </section>
      </aside>
    </main>

    <script src="clock.js"></script>
  </body>
</html>
